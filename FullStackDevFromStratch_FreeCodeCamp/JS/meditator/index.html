<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Zen Rep Counter</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <div class="container">
            <h1>🧘 Zen Repetition Counter</h1>

            <div class="counter-display">
                <h2 id="count-el">0</h2>
                <p class="subtitle">Current Session</p>
            </div>

            <div class="buttons">
                <button id="increment-btn" onclick="increment()">+1 Rep</button>
                <button id="save-btn" onclick="save()">Finish Set</button>
                <button id="reset-btn" onclick="reset()">Reset</button>
            </div>

            <p id="log-count">Previous Sets:</p>
        </div>

        <script src="index.js"></script>
    </body>

</html>
