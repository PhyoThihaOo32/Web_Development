<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Part2_HTML_CSS</title>
    <link rel="stylesheet" href="look.css" />

    <!-- TASK 2
    we put the css link in the head because browser should load the css before the page is shown.
    if css in the body - the brower will show the skeleton html first and then load the styling.-->
  </head>
  <body>
    <h1>My Checkpoint page</h1>
    <p id="intro">
      (Slow Radio Music Playing) Drivin' down the road, I get a feelin' that I
      should've been home ♫⋆｡♪ ₊˚♬
    </p>
    <h2 id="section-title">Random Songs</h2>
    <ul>
      <li class="highlight">Drown-Bring me the Horizon</li>
      <li>Shadow of the Day-Linkin Park</li>
      <li class="highlight">Tangled up in you-Staind</li>
      <li>Somewhere Only we know-Kane</li>
    </ul>
    <div id="box">Old Radio Channel</div>
    <button id="click-me">Click ME</button>
